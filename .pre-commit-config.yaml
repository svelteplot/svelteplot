repos:
    - repo: local
      hooks:
          - id: oxlint
            name: oxlint (type-aware)
            entry: bash -c 'pnpm exec svelte-kit sync && pnpm exec oxlint --type-aware --fix'
            language: system
            files: \.(js|ts|mts|cts|svelte)$
            pass_filenames: false
          - id: svelte-check-staged
            name: svelte-check (commit files)
            entry: node scripts/svelte-check-staged.mjs
            language: system
            files: \.(svelte|svelte\.ts|ts|mts|cts|js)$
            pass_filenames: true
